version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout
      - run:
          name: Grant execute permission
          command: chmod +x gradlew
      - run:
          name: Build APK
          command: ./gradlew assembleOnlineDebug --no-daemon
      - store_artifacts:
          path: app/build/outputs/apk/online/debug/app-online-debug.apk
          destination: zcode-harness.apk

workflows:
  build:
    jobs:
      - build-apk
